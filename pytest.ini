[pytest]
testpaths = tests
base_url = https://mireille-kafando.github.io
addopts = --tracing retain-on-failure --screenshot only-on-failure
markers =
    portfolio: tests de la page d'accueil du portfolio
    demo: tests de la démo de détection de piétons
    a11y: vérifications d'accessibilité
    liens: vérification des liens externes (réseau)
